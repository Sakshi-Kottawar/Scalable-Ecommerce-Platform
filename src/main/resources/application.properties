spring.application.name=productservice
productService=fakeStoreProductService

# =====================================================================
# DATA SOURCE CONFIGURATION
# =====================================================================
# The JDBC URL format is: jdbc:mysql://[host]:[port]/[database_name]
spring.datasource.url=jdbc:mysql://localhost:3306/productService?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true

# Database Credentials
spring.datasource.username=root
spring.datasource.password=root123

# Driver Class Name (Optional for modern Spring Boot versions, deduced automatically)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =====================================================================
# JPA & HIBERNATE CONFIGURATION
# =====================================================================
# Specify the database dialect to optimize SQL generation
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Controls database schema generation (update, create, create-drop, validate, none)
spring.jpa.hibernate.ddl-auto=update

# Show SQL queries executed in the console (useful for development)
spring.jpa.show-sql=true

# Format the printed SQL logs for better readability
spring.jpa.properties.hibernate.format_sql=true
